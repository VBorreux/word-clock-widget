<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c24"/>
      <stop offset="1" stop-color="#0a0a0e"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="5" y="5" width="246" height="246" rx="54" fill="url(#bg)" stroke="#2b2b35" stroke-width="2"/>

  <g fill="#2c2c35">
    <rect x="82" y="30" width="40" height="40" rx="10"/>
    <rect x="134" y="30" width="40" height="40" rx="10"/>
    <rect x="186" y="30" width="40" height="40" rx="10"/>
    <rect x="30" y="82" width="40" height="40" rx="10"/>
    <rect x="82" y="82" width="40" height="40" rx="10"/>
    <rect x="134" y="82" width="40" height="40" rx="10"/>
    <rect x="186" y="82" width="40" height="40" rx="10"/>
    <rect x="30" y="134" width="40" height="40" rx="10"/>
    <rect x="82" y="134" width="40" height="40" rx="10"/>
    <rect x="30" y="186" width="40" height="40" rx="10"/>
    <rect x="82" y="186" width="40" height="40" rx="10"/>
    <rect x="134" y="186" width="40" height="40" rx="10"/>
  </g>

  <g fill="#ffffff" filter="url(#glow)">
    <rect x="30" y="30" width="40" height="40" rx="10"/>
    <rect x="134" y="134" width="40" height="40" rx="10"/>
    <rect x="186" y="134" width="40" height="40" rx="10"/>
    <rect x="186" y="186" width="40" height="40" rx="10"/>
  </g>
</svg>
